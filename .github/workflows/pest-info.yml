# 병해충 발생정보 자동 갱신
# 농촌진흥청이 매달 초(여름엔 중순에도) 새 호를 올리므로 1~6일, 13~17일에 확인하고, 바뀐 경우에만 커밋합니다.
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions → NONGSARO_API_KEY

name: 병해충 발생정보 갱신

on:
  schedule:
    - cron: '0 1,9 1-6,13-17 * *'  # 오전 10시, 오후 6시 (한국 시간)
  workflow_dispatch:                # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PDF 글자 추출 도구 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: 병해충 발생정보 가져오기
        shell: pwsh
        env:
          NONGSARO_API_KEY: ${{ secrets.NONGSARO_API_KEY }}
        run: ./scripts/fetch-pest.ps1

      - name: 바뀌었으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/pest.json images/pests
          git diff --cached --quiet || (git commit -m "병해충 발생정보 갱신" && git pull --rebase && git push)
